# muscle-meta.com. Only `site/` is published, so CLAUDE.md, docs/, content/
# and anything else in the repo stay out of the public website.
# The build step renders content/blog/*.md into site/blog/ (scripts/build-blog.mjs).
# Every other page is still a hand-written file served as-is.
[build]
  publish = "site"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Shared assets change rarely. Bump the ?v= query in the page links when they do.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# The content editor must never be cached stale or framed elsewhere.
[[headers]]
  for = "/cms/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex, nofollow"
